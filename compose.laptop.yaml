services:
  nginx:
    ports:
      - "80:80"
    # Laptop/Docker Desktop override: the official nginx image needs normal
    # startup privileges to chown temp dirs and switch worker user. The stricter
    # production cap_drop settings can make nginx bind but hang/crash in WSL.
    cap_drop: []
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
